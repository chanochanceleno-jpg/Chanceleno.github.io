      pt: "EUR, USD, AOA, XAF, CDF"
    texte:
      fr: "Les offres peuvent être établies dans la devise adaptée à l'opération."
      en: "Offers can be issued in the currency best suited to the operation."
      pt: "As propostas podem ser emitidas na moeda adequada à operação."


# ----------------------------------------------------------------------------------------------------------------
# Références clients (section « Ils nous font confiance » de l'accueil)
# La section n'apparaît que si au moins une référence a « autorisation: oui ».
# Ne saisir que de vrais clients ayant donné leur accord écrit pour être cités.
#   nom, secteur, pays : texte unique, ou {fr: …, en: …, pt: …} s'il change selon la langue
#   temoignage         : fr obligatoire ; en et pt facultatifs (sans traduction, la référence n'apparaît qu'en français)
#   photo              : facultatif, nom d'un fichier placé dans static/images/references/ (ex. "client-x.jpg")
# Exemple (à recopier sous « references: » en retirant les # et en remplaçant [] ) :
#   - nom: "Société Exemple SARL"
#     secteur: {fr: "Santé et laboratoire", en: "Health and laboratory", pt: "Saúde e laboratório"}
#     pays: {fr: "Angola", en: "Angola", pt: "Angola"}
#     temoignage:
#       fr: "Texte exact du témoignage, tel que validé par le client."
#       en: ""
#       pt: ""
#     autorisation: oui
# ----------------------------------------------------------------------------------------------------------------
references: []


# ----------------------------------------------------------------------------------------------------------------
# Photos : il suffit de déposer le fichier (JPG ou PNG) au bon endroit dans static/images/ ;
# il est converti en WebP et redimensionné à la génération. Sans fichier, l'affichage actuel ne change pas.
#   static/images/accueil.jpg                   visuel de l'accueil (remplace l'illustration du globe)
#   static/images/secteurs/<secteur>.jpg        en haut de la page du secteur, ex. secteurs/sante-laboratoire.jpg
#                                               (nom = fin de l'adresse française de la page du secteur)
#   static/images/marches/<id>.jpg              en tête de la carte Marchés, ex. marches/luanda.jpg
#   static/images/fondateur.jpg                 photo du fondateur (accueil et À propos)
#   static/images/references/<fichier>          photo ou logo d'une référence (voir ci-dessus)
# Description de la photo d'accueil, lue par les lecteurs d'écran et les moteurs de recherche :
# ----------------------------------------------------------------------------------------------------------------
photos:
  accueil_description:
    fr: ""
    en: ""
    pt: ""


# ----------------------------------------------------------------------------------------------------------------
# Statistiques de visite GoatCounter, sans cookie.
# « goatcounter » = code du compte (tableau de bord : https://chanceleno.goatcounter.com).
# Laisser vide ( goatcounter: "" ) pour désactiver complètement le comptage.
# ----------------------------------------------------------------------------------------------------------------
statistiques:
  goatcounter: chanceleno


# ----------------------------------------------------------------------------------------------------------------
# Indicatifs téléphoniques proposés dans les formulaires Devis et Partenaires, dans l'ordre de la liste.
#   pays      : code du pays en 2 lettres majuscules (sert au drapeau), ex. AO
#   indicatif : chiffres seuls, sans + ni 00, ex. "244"
#   nom       : nom du pays, texte unique ou {fr: …, en: …, pt: …}
# Le choix « Autre » (saisie libre de l'indicatif) est ajouté automatiquement en fin de liste.
# par_defaut : pays présélectionné selon la langue de la page ("" = aucun), ex. {fr: FR, en: "", pt: AO}
